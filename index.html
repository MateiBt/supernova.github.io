<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practică Astronomie 3D - Joc Complet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustări rapide pentru noile elemente de UI */
        .score-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .score-table th, .score-table td { border: 1px solid #444; padding: 5px; text-align: center; }
        .score-table th { background: #222; }
        #timer-display { font-size: 1.1rem; color: #ffeb3b; font-weight: bold; margin-top: 5px; }
        .leaderboard-list { margin: 0; padding-left: 20px; font-size: 0.85rem; color: #fff; }
        .leaderboard-section { margin-top: 15px; border-top: 1px solid #555; padding-top: 10px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <h2>Planetariu Quiz</h2>
        
        <label>Alege Dificultatea:</label>
        <select id="select-difficulty">
            <option value="easy">Ușor (Stele până la 2m)</option>
            <option value="medium" selected>Mediu (Stele până la 4m)</option>
            <option value="hard">Greu (Stele până la 5m)</option>
            <option value="extreme">Extrem (Stele până la 6.5m)</option>
        </select>

        <label>Timp Scurs:</label>
        <div id="timer-display">00:00</div>
        
        <p style="margin-top: 15px;">Misiune: <span id="target-instruction" style="color: #ffeb3b; font-weight: bold;">Se încarcă...</span></p>
        
        <div id="quiz-form">
            <label>Nume Tradițional:</label>
            <input type="text" id="input-name" placeholder="ex: Vega, Sirius..." autocomplete="off" />
            
            <label>Tipul Obiectului:</label>
            <select id="select-type">
                <option value="">Alege...</option>
                <option value="simpla">Stea Simplă</option>
                <option value="dubla">Stea Dublă / Multiplă</option>
                <option value="pulsatila">Variabilă Pulsatilă</option>
                <option value="rotativa">Variabilă Rotativă</option>
                <option value="eruptiva">Variabilă Eruptivă</option>
                <option value="alta">Alt tip / Nespecificat</option>
            </select>
            
            <button id="btn-check">Verifică Răspunsul</button>
        </div>
        
        <div id="feedback"></div>
        <button id="btn-next" style="display: none;">Următorul Obiect</button>

        <table class="score-table">
            <thead>
                <tr>
                    <th>Componentă</th>
                    <th style="color: #28a745;">Corect</th>
                    <th style="color: #dc3545;">Greșit</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Locație (Click)</td>
                    <td id="score-loc-c">0</td>
                    <td id="score-loc-g">0</td>
                </tr>
                <tr>
                    <td>Nume Trad.</td>
                    <td id="score-name-c">0</td>
                    <td id="score-name-g">0</td>
                </tr>
                <tr>
                    <td>Tipul Stelei</td>
                    <td id="score-type-c">0</td>
                    <td id="score-type-g">0</td>
                </tr>
            </tbody>
        </table>

        <div class="leaderboard-section">
            <h3>Top Scoruri</h3>
            <ol id="leaderboard-list" class="leaderboard-list"></ol>
            <button id="btn-save-score" style="padding: 5px; font-size: 0.8rem; margin-top: 8px; background: #555;">Salvează Scorul Curent</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="database.js"></script>
    <script src="main.js"></script>
</body>
</html>
