<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernova Guide | Celestial Mechanics</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-deep: #050b14; 
            --bg-panel: rgba(13, 20, 33, 0.7);
            --bg-hover: rgba(20, 30, 48, 0.9);
            --text-main: #a1aab8;
            --text-light: #ffffff;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        html { 
            scroll-behavior: smooth; 
            overflow-y: scroll; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-out;
        }

        .universe-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2048&auto=format&fit=crop');
            background-size: cover; background-position: center; opacity: 0.12; 
        }

        nav { 
            position: fixed; top: 0; width: 100%; 
            background: rgba(5, 11, 20, 0.95); border-bottom: 1px solid var(--border-subtle); 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 50px; z-index: 1000; box-sizing: border-box;
        }

        .nav-logo { text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .nav-logo i { color: #fbbf24; font-size: 1.6rem; }
        
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .main { font-weight: 700; font-size: 1.2rem; color: var(--text-light); letter-spacing: 1px; }
        .logo-text .sub { font-weight: 400; font-size: 0.65rem; color: var(--accent-blue); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; }

        .nav-links { display: flex; align-items: center; }
        .nav-links a { 
            color: var(--text-main); text-decoration: none; margin: 0 20px; 
            font-weight: 500; font-size: 0.85rem; transition: color 0.2s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-light); } 

        .btn-auth { 
            background: transparent; border: 1px solid var(--border-subtle); color: var(--text-light); 
            padding: 8px 24px; border-radius: 2px; cursor: pointer; font-weight: 500; 
            margin-left: 20px; transition: all 0.2s ease; font-size: 0.85rem; 
        }
        .btn-auth:hover { background: var(--text-light); color: var(--bg-deep); }

        header { padding: 140px 20px 40px; text-align: center; max-width: 1200px; margin: 0 auto; }
        
        .back-link { 
            display: inline-flex; align-items: center; gap: 8px; 
            color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.85rem;
            margin-bottom: 20px; transition: 0.2s; 
            padding: 8px 16px; background: transparent; border: 1px solid var(--border-subtle); border-radius: 2px;
        }
        .back-link:hover { color: var(--text-light); background: var(--bg-panel); border-color: var(--text-light); }

        .page-title { 
            font-size: 2.8rem; font-weight: 700; color: var(--text-light); margin: 10px 0;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            background: linear-gradient(135deg, #ffffff 20%, #93c5fd 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;
        }
        .page-title i { -webkit-text-fill-color: initial; color: var(--text-light); font-size: 2.2rem;}

        .layout-wrapper {
            max-width: 1200px; 
            margin: 0 auto 100px; 
            padding: 0 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            align-items: start;
        }

        .filters-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 100px;
        }

        .filter-header {
            font-size: 1.1rem;
            color: var(--text-light);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 15px;
            font-weight: 600;
        }
        .filter-header i { color: var(--accent-blue); }

        .filter-group { display: flex; flex-direction: column; width: 100%; }
        
        .filter-label {
            font-size: 0.75rem; color: var(--text-main); margin-bottom: 8px;
            text-transform: uppercase; font-weight: 600; letter-spacing: 1px;
        }

        .filter-input, .filter-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            color: var(--text-light);
            padding: 10px 12px;
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .filter-input:focus, .filter-select:focus {
            border-color: var(--text-main);
            background: rgba(0, 0, 0, 0.5);
        }
        .filter-select option { background: var(--bg-deep); color: var(--text-light); }

        .no-results-msg {
            text-align: center; color: var(--text-main); font-style: italic;
            padding: 40px 20px; display: none; width: 100%;
            background: transparent; border-radius: 2px; border: 1px dashed var(--border-subtle);
        }

        .problem-section { display: flex; flex-direction: column; width: 100%; }
        
        .problem-card {
            background: var(--bg-panel); 
            border-radius: 2px; 
            margin-bottom: 30px; 
            padding: 35px;
            border: 1px solid var(--border-subtle); 
            position: relative; 
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;
        }
        .problem-card:hover { border-color: #3b4252; background: var(--bg-hover); }
        
        .card-header-badges { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

        .source-badge { 
            display: inline-block; padding: 4px 10px; border-radius: 2px; 
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05); color: var(--text-light); 
            border: 1px solid var(--border-subtle);
        }

        .diff-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 2px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid transparent;
        }
        .diff-easy { background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.2); }
        .diff-medium { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border-color: rgba(245, 158, 11, 0.2); }
        .diff-hard { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.2); }
        .diff-theory { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border-color: rgba(139, 92, 246, 0.2); }

        .problem-text { font-size: 1rem; color: var(--text-light); margin-bottom: 25px; line-height: 1.7; font-weight: 400;}
        .problem-text strong { font-weight: 600; font-size: 1.1rem; color: var(--accent-blue); display: block; margin-bottom: 10px;}

        .solve-btn {
            background: transparent; border: 1px solid var(--border-subtle); color: var(--text-main);
            padding: 8px 20px; border-radius: 2px; cursor: pointer; font-weight: 500;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.85rem; font-family: 'Inter', sans-serif;
        }
        .solve-btn:hover { background: var(--text-light); color: var(--bg-deep); border-color: var(--text-light); }
        .solve-btn.solved { background: #10b981; color: #000; border-color: #10b981; }

        details { margin-top: 10px; }
        details summary { 
            cursor: pointer; font-weight: 500; color: var(--text-main); outline: none; list-style: none; 
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 0.9rem;
        }
        details summary:hover { color: var(--text-light); }
        details summary::before { content: '\f078'; font-family: "Font Awesome 6 Free"; font-weight: 900; transition: transform 0.2s; font-size: 0.7rem; }
        details[open] summary::before { transform: rotate(180deg); }
        details[open] summary { margin-bottom: 15px; color: var(--text-light); }
        
        .solution-box { 
            margin-top: 15px; padding: 25px; background: rgba(0, 0, 0, 0.3); 
            border-radius: 2px; border: 1px solid var(--border-subtle); 
            font-size: 0.95rem; color: var(--text-main); line-height: 1.6;
        }
        .solution-box strong { color: var(--text-light); font-weight: 600; }

        .user-diagram { 
            display: block; max-width: 100%; width: 400px; height: auto; margin: 20px auto; 
            border-radius: 2px; border: 1px solid var(--border-subtle);
            cursor: zoom-in; transition: transform 0.2s; padding: 5px; background: rgba(255,255,255,0.05);
        }
        .user-diagram:hover { border-color: rgba(255,255,255,0.2); }

        .pagination-container {
            display: flex; justify-content: center; gap: 8px; margin-top: 40px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .page-btn {
            background: transparent; border: 1px solid var(--border-subtle); color: var(--text-main);
            padding: 8px 14px; border-radius: 2px; cursor: pointer; transition: 0.2s;
            font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.85rem;
        }
        .page-btn:hover { background: var(--bg-hover); color: var(--text-light); border-color: var(--text-light); }
        .page-btn.active { background: var(--text-light); color: var(--bg-deep); border-color: var(--text-light); }

        .modal { display: none; position: fixed; z-index: 3000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { margin: auto; display: block; width: auto; max-width: 90%; max-height: 90vh; border-radius: 2px; }
        .close { position: absolute; top: 20px; right: 35px; color: var(--text-main); font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .close:hover { color: var(--text-light); }

        .auth-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .auth-content { background: var(--bg-deep); padding: 40px; border-radius: 2px; width: 320px; text-align: center; border: 1px solid var(--border-subtle); position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; color: var(--text-main); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .close-btn:hover { color: var(--text-light); }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0 16px; background: var(--bg-panel); border: 1px solid var(--border-subtle); color: var(--text-light); border-radius: 2px; outline: none; box-sizing: border-box; font-family: 'Inter', sans-serif;}
        .auth-input:focus { border-color: var(--text-main); }
        .submit-btn { width: 100%; padding: 12px; background: var(--text-light); border: none; color: var(--bg-deep); font-weight: 600; border-radius: 2px; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #e2e8f0; }
        .toggle-text { font-size: 0.85rem; margin-top: 20px; color: var(--text-main); }
        .toggle-text span { color: var(--text-light); cursor: pointer; text-decoration: underline; }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; }

        @media(max-width: 900px) {
            nav { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 10px; }
            .layout-wrapper { grid-template-columns: 1fr; }
            .filters-container { position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <div class="universe-bg"></div>

    <nav>
        <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-star"></i>
            <div class="logo-text">
                <span class="main">SUPERNOVA</span>
                <span class="sub">Guide</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="handouts.html">Handouts</a>
            <a href="problems.html" class="active">Practice</a> 
            <a href="resources.html">Resources</a>
            <a href="community.html">Community</a>
            <a href="profile.html" id="profileLink" style="display: none;">My Profile</a>
        </div>

        <div class="nav-auth-container">
            <button id="loginBtn" class="btn-auth">Login</button>
            <button id="logoutBtn" class="btn-auth" style="display: none;">Logout</button>
        </div>
    </nav>

    <header>
        <a href="problems.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Categories</a>
        <h1 class="page-title"><i class="fa-solid fa-satellite"></i> Celestial Mechanics</h1>
    </header>

    <div class="layout-wrapper">
        
        <aside class="filters-container">
            <h3 class="filter-header"><i class="fas fa-filter"></i> Mission Filters</h3>
            
            <div class="filter-group">
                <label class="filter-label">Search by ID / Topic</label>
                <input type="text" id="searchFilter" class="filter-input" placeholder="e.g. Q1 USAAAO 2025">
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Difficulty Level</label>
                <select id="diffFilter" class="filter-select">
                    <option value="all">All Difficulties</option>
                    <option value="easy">Easy (Score 1-4)</option>
                    <option value="medium">Medium (Score 5-7)</option>
                    <option value="hard">Hard (Score 8-10)</option>
                    <option value="theory">Theory (Conceptual)</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Completion Status</label>
                <select id="statusFilter" class="filter-select">
                    <option value="all">All Problems</option>
                    <option value="unsolved">Unsolved</option>
                    <option value="solved">Solved</option>
                </select>
            </div>
        </aside>

        <div class="problem-section">
            
            <div id="noResultsMsg" class="no-results-msg">
                <i class="fas fa-satellite-dish" style="font-size: 2rem; margin-bottom: 15px; display:block; color: var(--text-muted);"></i>
                <strong style="color: var(--text-light); font-size: 1.1rem; display:block; margin-bottom:5px;">No signals detected.</strong>
                Try adjusting your search or filters!
            </div>

            <div id="problems-container"></div>

            <div id="paginationContainer" class="pagination-container"></div>
            
        </div> 
    </div> 
    
    <div id="authModal" class="auth-modal">
        <div class="auth-content">
            <span class="close-btn"><i class="fas fa-times"></i></span>
            <h3 id="modalTitle" style="color: var(--text-light); margin: 0 0 20px 0; font-weight: 600;">Student Login</h3>
            <form id="authForm">
                <input type="text" id="usernameInput" class="auth-input" placeholder="Username" style="display:none;">
                <input type="email" id="emailInput" class="auth-input" placeholder="Academic Email" required>
                <input type="password" id="passwordInput" class="auth-input" placeholder="Password" required>
                <button type="submit" id="submitAuthBtn" class="submit-btn">Sign In</button>
                <p id="authError" class="error-msg"></p>
            </form>
            <p class="toggle-text" id="toggleText">New to the platform? <span>Register</span></p>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/render_problems.js"></script>
</body>
</html>
